<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>题库采集 · CyberWikiBench</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand">CWKB <small>题库采集</small></span>
        <button id="refreshButton" class="icon-btn" type="button" aria-label="刷新列表">↻</button>
      </div>
    </header>

    <main class="views">
      <!-- 登录（服务端启用多用户鉴权时出现） -->
      <section id="loginView" class="view" hidden>
        <form id="loginForm" class="login-card" novalidate>
          <h2>登录题库</h2>
          <p class="login-hint">该服务已启用多用户鉴权，输入服务端分配的账号。</p>
          <label class="field">
            <span>User ID</span>
            <input id="loginUserId" type="text" autocomplete="username" spellcheck="false" required />
          </label>
          <label class="field">
            <span>Key</span>
            <input id="loginKey" type="password" autocomplete="current-password" spellcheck="false" required />
          </label>
          <button class="button button-primary button-wide" type="submit">登录</button>
          <p id="loginStatus" class="settings-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- 题库列表 -->
      <section id="bankView" class="view">
        <form id="searchForm" class="search-row" role="search" novalidate>
          <input id="searchInput" type="search" placeholder="检索题目 / 答案…" enterkeyhint="search" />
          <button class="icon-btn" type="submit" aria-label="检索">🔍</button>
        </form>
        <div id="statsRow" class="stats-row" aria-live="polite"></div>
        <div id="extractionList" class="card-list" aria-live="polite"></div>
        <button id="loadMoreButton" class="button button-secondary button-wide" type="button" hidden>加载更多</button>
      </section>

      <!-- 提取详情 -->
      <section id="detailView" class="view" hidden>
        <div class="detail-head">
          <button id="backButton" class="button button-secondary" type="button">← 返回</button>
          <div class="detail-copy">
            <h2 id="detailTitle">提取详情</h2>
            <p id="detailMeta"></p>
          </div>
        </div>
        <div class="detail-actions">
          <button id="solvePageButton" class="button button-primary" type="button">解答本页</button>
          <button id="solveAllButton" class="button button-secondary" type="button">全部解答 · 逐页</button>
          <button id="deleteButton" class="button button-danger" type="button">删除</button>
        </div>
        <div id="paginationBar" class="pagination-bar" hidden>
          <button id="prevPageButton" class="icon-btn page-btn" type="button" aria-label="上一页">‹</button>
          <span id="pageInfo" class="page-info"></span>
          <button id="nextPageButton" class="icon-btn page-btn" type="button" aria-label="下一页">›</button>
          <form id="jumpForm" class="jump-form" novalidate>
            <input id="jumpInput" type="number" min="1" step="1" inputmode="numeric" placeholder="题号" aria-label="跳转到题号" />
            <button class="button button-secondary button-small" type="submit">跳转</button>
          </form>
        </div>
        <div id="questionList" class="card-list"></div>
      </section>

      <!-- 设置 -->
      <section id="settingsView" class="view" hidden>
        <form id="settingsForm" novalidate>
          <label class="field">
            <span>接口 Base 地址</span>
            <input id="endpointInput" type="url" inputmode="url" autocomplete="off"
              placeholder="https://api.deepseek.com/v1" required />
            <small>OpenAI 兼容服务；填 Base 地址（以 /v1 结尾）或完整 …/chat/completions 均可。</small>
          </label>
          <label class="field">
            <span>API Key <em id="apiKeyHint"></em></span>
            <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" />
            <small>已保存过密钥时留空表示不修改。密钥只保存在本机 data/collector_config.json。</small>
          </label>
          <label class="field">
            <span>模型 ID</span>
            <input id="modelInput" type="text" autocomplete="off" placeholder="deepseek-chat" required />
          </label>
          <div class="field-row">
            <label class="field">
              <span>最大输出 Token</span>
              <input id="maxTokensInput" type="number" min="16" max="8192" step="1" value="512" required />
            </label>
            <label class="field">
              <span>超时（毫秒）</span>
              <input id="timeoutInput" type="number" min="1000" max="300000" step="500" value="60000" required />
            </label>
          </div>
          <div class="settings-actions">
            <button id="testButton" class="button button-secondary" type="button">测试连接</button>
            <button id="saveButton" class="button button-primary" type="submit">保存设置</button>
          </div>
          <p id="settingsStatus" class="settings-status" role="status" aria-live="polite"></p>
          <button id="logoutButton" class="button button-secondary button-wide" type="button" hidden>退出登录</button>
        </form>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab-button is-active" data-tab="bank" type="button">题库</button>
      <button class="tab-button" data-tab="settings" type="button">设置</button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
